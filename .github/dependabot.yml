version: 2

# Lockfiles drift silently until a build breaks: desktop/package-lock.json was
# out of sync with its own cross-env devDependency (ec2a361) and had to be
# repaired by hand.
#
# Two things are tuned deliberately, both learned from the first run, which
# opened fifteen pull requests at once against a repo that had never run
# Dependabot before:
#
#  1. Groups carry *every* update type, majors included. Restricting a group to
#     minor+patch does not exclude majors, it gives each one its own PR -- so a
#     backlog of accumulated majors arrives as a flood rather than one branch.
#  2. Major bumps of the four dependencies that define the shipped app are
#     ignored outright. Electron, electron-builder, Next and React majors are
#     migrations with breaking changes, scheduled and tested on their own; an
#     automated PR for one is noise at best and a trap at worst, because a green
#     check does not mean the packaged app still launches.
#
# Security updates are not governed by this file and still arrive regardless of
# the ignore rules below.
#
# pip is absent on purpose. Every dependency in pyproject.toml is pinned with
# `>=`, so CI already installs the newest compatible release and a Dependabot
# PR only raises the floor -- it cannot change what actually gets installed.
updates:
  # Covers .github/workflows/* and the composite action in .github/actions/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron-builder"
        update-types: ["version-update:semver-major"]
    groups:
      desktop:
        patterns: ["*"]
