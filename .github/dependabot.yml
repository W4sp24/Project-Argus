version: 2

# Lockfiles drift silently until a build breaks: desktop/package-lock.json was
# out of sync with its own cross-env devDependency (ec2a361) and had to be
# repaired by hand.
#
# Two things are tuned deliberately, both learned from the first run, which
# opened fifteen pull requests at once against a repo that had never run
# Dependabot before:
#
#  1. npm majors are ignored outright, for every package. Restricting a group to
#     minor+patch does not exclude majors, it gives each one its own PR -- which
#     is how a backlog arrived as fifteen branches. But letting the group carry
#     majors instead is worse: the very next run proposed tailwindcss 3 -> 4, a
#     ground-up rewrite, together with eslint 8 -> 10 (flat config, incompatible
#     with the pinned eslint-config-next 14) and typescript 5 -> 7, bundled into
#     one PR where a single bad major poisons the whole group. A major here is a
#     migration to schedule, not a PR to merge.
#  2. github-actions majors DO come through, ungrouped by update type. Action
#     majors are mostly runtime bumps, and refusing them means sitting on
#     deprecation warnings when GitHub retires a Node version under the runners.
#
# Security updates are not governed by this file and still arrive regardless of
# the ignore rules below.
#
# pip is absent on purpose. Every dependency in pyproject.toml is pinned with
# `>=`, so CI already installs the newest compatible release and a Dependabot
# PR only raises the floor -- it cannot change what actually gets installed.
updates:
  # Covers .github/workflows/* and the composite action in .github/actions/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      desktop:
        patterns: ["*"]
