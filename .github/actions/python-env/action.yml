name: Python environment
description: >
  The one definition of Argus's Python environment. Every job that runs backend
  code -- tests, e2e and the frozen build -- installs from here, so no caller
  can ever run against a different dependency set than the one that ships.

inputs:
  dev:
    description: Also install the dev extra (pytest, ruff). Off for packaging.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        # Without this, setup-python resolves the cache key against a
        # requirements.txt that does not exist in this repo, and the cache
        # silently does nothing.
        cache-dependency-path: pyproject.toml

    # Windows PyPI torch is already CPU-only, so pinning the index there is
    # just explicitness. On Linux it is load-bearing: the default index pulls
    # ~2.5GB of nvidia-* wheels that nothing here uses.
    - name: Install torch (CPU)
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    # The runtime extras are written here and nowhere else. release.yml
    # installing a strict subset of what the code imports is exactly how
    # v0.2.0 shipped a backend with no google_auth_oauthlib, whose connector
    # then failed for every user with an HTTP 501 telling them to pip install
    # an extra into an app that has no pip.
    - name: Install Argus
      shell: bash
      env:
        DEV: ${{ inputs.dev }}
      run: |
        set -euo pipefail
        extras="rag,gcal"
        if [ "$DEV" = "true" ]; then
          extras="$extras,dev"
        fi
        echo "installing .[$extras]"
        pip install -e ".[$extras]"
