name: ci

# Until v0.2.1 the only workflow in this repo was release.yml, so neither
# pytest nor Playwright had ever run in CI -- the entire suite was local-only.
# That is a large part of why v0.2.0 shipped with a backend missing two
# connector libraries and several features that were never wired up: nothing
# ran the tests that would have said so.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: these jobs install torch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Every extra, deliberately: the point of this job is to run the code
      # the release actually ships, and release.yml installing a strict subset
      # of what the code imports is precisely the v0.2.0 bug.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[rag,gcal,dev]"

      # Scoped to the packages this release touched. The repo carries a
      # pre-existing lint backlog (long lines and datetime.UTC aliases in
      # telemetry/ and flashcards/, plus several test modules); failing the
      # whole build on it would just teach everyone to ignore a red X. Widen
      # the scope as that backlog is cleared.
      - name: Lint
        run: ruff check backend/core backend/rag backend/vault backend/connectors backend/features/index

      - name: Test
        run: pytest -q

  web:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npx tsc --noEmit
        working-directory: web

      - run: npm run lint
        working-directory: web

      - run: npm run build
        working-directory: web

      # pyproject / web / desktop all claimed 0.1.0 while v0.2.0 was the
      # shipped tag, because only desktop/package.json reaches the installed
      # app and nothing compared the three.
      - run: npm ci
        working-directory: desktop

      - run: node scripts/check-versions.mjs
        working-directory: desktop

  e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[rag,gcal,dev]"

      - run: npm ci
        working-directory: web

      - run: npx playwright install --with-deps chromium
        working-directory: web

      # start-backend.mjs defaults to a repo-local .venv, which a hosted
      # runner does not have; ARGUS_PYTHON points it at the runner's
      # interpreter instead.
      - name: Playwright
        run: npm run e2e
        working-directory: web
        env:
          ARGUS_PYTHON: python

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
