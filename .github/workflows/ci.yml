name: ci

# The only entry point for branch work. Until v0.2.1 this repo had no CI at
# all -- release.yml was the whole pipeline -- which is a large part of why
# v0.2.0 shipped with a backend missing two connector libraries and several
# features that were never wired up: nothing ran the tests that would have
# said so.
#
# The actual test and build definitions live in _test.yml and _package.yml so
# release.yml runs the identical ones. Nothing is duplicated here.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a PR push is fine. Cancelling a main run is not: that run is
  # the only rehearsal packaging gets before someone tags.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/_test.yml
    with:
      # PRs get the fast runner. Merges re-run on the platform Argus actually
      # ships on, so a Windows-only break is caught at merge and cannot reach
      # a tag.
      os: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'windows-latest' }}

  # Merges only. Builds and smoke-tests the real installer without publishing
  # anything, so tagging is a path that has already been walked on this code.
  package:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: read
    uses: ./.github/workflows/_package.yml
    with:
      publish: false
