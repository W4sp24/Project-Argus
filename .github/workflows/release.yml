name: release

# Tag-driven: `git tag v0.2.2 && git push origin v0.2.2` tests, builds and
# publishes. Pre-release tags (v0.0.7-test) are what you should use to
# rehearse the update loop before shipping anything real.
#
# guard -> test -> package. The test job is the same _test.yml every PR runs,
# so a tag can no longer be built from code that never passed: previously this
# workflow ran no tests at all and would happily publish a red commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-flight. A half-finished publish is the one
  # state this repo cannot recover from.
  cancel-in-progress: false

jobs:
  # Kept first and standalone so a doomed tag fails in seconds rather than
  # after a 15-minute test run. Release immutability freezes a release's
  # assets the moment it is published, so an already-published tag can never
  # have the installer attached to it -- electron-builder only finds that out
  # at upload time, right at the end. That is exactly how v0.2.0 shipped
  # empty. A published tag is unrecoverable by design; the only way forward
  # is a new version.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse to build over an already-published release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh resolves the repo from this, so no checkout is needed here.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo absent)
          case "$state" in
            absent) echo "no release for $GITHUB_REF_NAME yet - a draft will be created" ;;
            true)   echo "reusing the existing draft for $GITHUB_REF_NAME" ;;
            *)      echo "::error title=release::$GITHUB_REF_NAME is already published, and an immutable release can never accept new assets. Tag a new version instead."
                    exit 1 ;;
          esac

  # windows-latest, not ubuntu: a release is checked on the platform it ships
  # on. _test.yml's web job also asserts here that pyproject.toml,
  # web/package.json and desktop/package.json all already equal the tag.
  test:
    needs: guard
    uses: ./.github/workflows/_test.yml
    with:
      os: windows-latest

  package:
    needs: test
    permissions:
      contents: write
    uses: ./.github/workflows/_package.yml
    with:
      publish: true
