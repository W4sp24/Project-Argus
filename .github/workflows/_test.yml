name: test

# The whole test suite, defined once. Both entry points call it: ci.yml on
# every PR and merge, release.yml before it is allowed to build a tag. Nothing
# else may run these commands, so "what CI checks" cannot drift from "what a
# release is checked against".
on:
  workflow_call:
    inputs:
      os:
        description: >
          Runner to test on. PRs pass ubuntu-latest for fast feedback; main
          and tags pass windows-latest, which is what Argus actually ships on.
        type: string
        required: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/python-env

      # A headless Linux runner has no OS keyring at all, so keyring.set_password
      # raises and seven tests that legitimately round-trip a real secret fail
      # for a reason that says nothing about this code -- as does doctor's
      # keyring probe in the smoke check below. keyrings.alt supplies a real
      # file-backed backend, so those tests still genuinely store, read back
      # and delete rather than being skipped. Windows is left alone: it has
      # the real backend, and it is the platform that ships.
      - name: Provide a headless keyring backend
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pip install keyrings.alt
          echo "PYTHON_KEYRING_BACKEND=keyrings.alt.file.PlaintextKeyring" >> "$GITHUB_ENV"

      # Repo-wide, with no allow-list: a package added tomorrow is linted
      # from its first commit rather than whenever someone remembers to
      # extend a path list here.
      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      # smoke_backend.py takes the plain module as well as the frozen exe.
      # Thirty seconds here catches the broken import chains that would
      # otherwise only surface inside the 30-minute packaging build.
      - name: Smoke-test the backend entry point
        run: python desktop/tests/smoke_backend.py --target desktop/backend/argus_server.py

  web:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npx tsc --noEmit
        working-directory: web

      - run: npm run lint
        working-directory: web

      # Pure logic only -- answer matching, distractor selection, delimited
      # parsing, job reconciliation. Components are covered by the e2e job
      # against a real backend, which is the only place their behaviour is
      # real. Runs before the build because it is seconds, and a broken
      # matcher should not wait on a bundle.
      - run: npm run test:unit
        working-directory: web

      - run: npm run build
        working-directory: web

      # Also pure node stdlib (node:test), so it runs without installing
      # electron. Covers the window-open guard, which is the shell's one
      # exception to denying every popup and is therefore worth a real test.
      - name: Test the desktop shell's pure helpers
        run: node --test "tests/*.test.js"
        working-directory: desktop

      # Pure node stdlib, so it needs no install -- the previous `npm ci` in
      # desktop/ pulled electron and sharp just to run this one script.
      # During a tag build GITHUB_REF_NAME makes it assert all three manifests
      # already equal the tag, which is what stops a release whose pyproject
      # and web versions were never bumped (both said 0.1.0 at v0.2.0).
      - name: Check version agreement
        run: node desktop/scripts/check-versions.mjs

  # Deliberately no `needs:`. This job consumes nothing from python or web --
  # it reinstalls everything itself -- so the barrier that used to be here
  # bought nothing and cost 5.6 minutes of measured idle per run.
  e2e:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      # Normalises the browser location across Linux and Windows so one cache
      # path works for both.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/python-env

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Resolve the Playwright version
        id: pw
        shell: bash
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on the resolved version, not the lockfile hash: the browser
      # bundle only changes when Playwright itself does.
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - run: npx playwright install --with-deps chromium
        working-directory: web

      # start-backend.mjs defaults to a repo-local .venv, which a hosted
      # runner does not have; ARGUS_PYTHON points it at the runner's
      # interpreter instead.
      - name: Playwright
        run: npm run e2e
        working-directory: web
        env:
          ARGUS_PYTHON: python

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ inputs.os }}
          path: web/playwright-report
          retention-days: 7
