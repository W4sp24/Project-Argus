[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.2.1"
description = "Argus - a local, Jarvis-style second brain built on Obsidian"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.140.8",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.13.4",
    "python-frontmatter>=1.1",
    "watchdog>=4.0",
    "keyring>=25.0",
    # Optional at runtime: only the "anthropic" (Claude Code CLI) provider
    # imports it, and that import is lazy. Argus runs entirely on Ollama or a
    # hosted API with Claude Code absent — see backend/agent/adapters.py.
    "claude-agent-sdk>=0.1",
    # The OpenAI-compatible and Anthropic API adapters speak HTTP directly
    # rather than pulling in a vendor SDK; httpx is also what FastAPI's own
    # test client uses.
    "httpx>=0.27",
    # `argus mcp-server`. Previously present only as a claude-agent-sdk
    # transitive, which would vanish the moment that dependency changed.
    "mcp>=1.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "fsrs>=6.0",
    # backend/connectors/todoist.py:66 imports this unconditionally (inside
    # list_tasks, but with no fallback), so it was never actually optional —
    # it only worked because it had been hand-installed into a local .venv and
    # was absent from every dependency list, including the frozen build.
    "todoist-api-python>=3.0",
]

[project.optional-dependencies]
# Heavy RAG stack - installed at Phase P1 (`pip install -e .[rag]`).
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "pdfplumber>=0.11",
    "python-pptx>=0.6",
    "python-docx>=1.1",
]
# Google Calendar connector (`argus connect gcal`). backend/connectors/gcal.py
# imports these lazily and only once a token is actually stored, so the base
# app (and /api/agenda, /api/insights) works fully without this extra —
# installing it is only needed to run the one-time OAuth connect flow.
gcal = [
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
argus = "backend.cli:main"

# `packages = ["backend"]` would list only the top-level package: every
# subpackage (backend.agent, backend.rag, backend.core, backend.features, ...)
# would be missing from a built wheel. Editable installs and PyInstaller's
# collect_submodules("backend") both hid that, so it went unnoticed.
[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
